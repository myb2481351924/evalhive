[project]
name = "evalhive"
version = "0.1.0"
description = "CI-style LLM evaluation and regression gating platform for test engineers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EvalHive" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "jsonschema>=4.22",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
evalhive = "evalhive.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalhive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
