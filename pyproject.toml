[project]
name = "evalhive"
version = "0.1.0"
description = "CI-style LLM evaluation and regression gating platform for test engineers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EvalHive" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "jsonschema>=4.22",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
evalhive = "evalhive.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalhive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # typer's documented style: Option()/Argument() in parameter defaults

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
